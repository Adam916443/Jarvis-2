
name: Build Jarvis APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"

      - name: Extract project
        run: |
          mkdir source
          unzip -q "$(find . -maxdepth 1 -name '*.zip' | head -1)" -d source
          PROJECT=$(find source -name gradlew -type f | head -1 | xargs dirname)
          echo "PROJECT=$PROJECT" >> $GITHUB_ENV

      - name: Build APK
        run: |
          chmod +x "$PROJECT/gradlew"
          "$PROJECT/gradlew" --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-APK
          path: source/**/app/build/outputs/apk/debug/*.apk
